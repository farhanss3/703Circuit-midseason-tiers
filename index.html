        ` : `
          <div class="change-list">
            ${changes.map(c => {
              const breakdown = [1,2,3,4,5].map(t => 
                `<span class="vb-cell ${c.winner===t?'win':''}">${c.counts[t]||0}</span>`
              ).join('');
              const finalDec = state.finalDecisions?.decisions?.[c.player.name];
              const approved = finalDec?.approved === true;
              const rejected = finalDec?.approved === false;
              const modeDiffers = c.mode !== c.mean && c.mode !== c.player.tier;
              return `
                <div class="change-card ${approved?'approved':''} ${rejected?'rejected':''}" data-player="${escapeHtml(c.player.name)}">
                  <div>
                    <div class="change-name">${escapeHtml(c.player.name)}</div>
                    <div class="change-meta">
                      <span class="team-dot team-${c.player.team}"></span> ${escapeHtml(c.player.team)} ·
                      <span class="rated-pill rated-full">All ${c.total} rated · avg T${c.rawMean.toFixed(1)}</span>
                      ${modeDiffers ? `<span class="rated-pill" style="background:var(--surface-tint);color:var(--muted)">plurality: T${c.mode}</span>` : ''}
                    </div>
                  </div>
                  <span class="tier-pill" data-tier="${c.player.tier}">T${c.player.tier}</span>
                  <svg class="arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                  <span class="tier-pill" data-tier="${c.winner}">T${c.winner}</span>
                  <div class="vote-breakdown" title="T1 / T2 / T3 / T4 / T5 counts">${breakdown}</div>
                  ${isCommish && !isFinalized ? `
                    <div class="change-actions">
                      <button class="btn sm danger" data-action="reject" data-player="${escapeHtml(c.player.name)}">${rejected ? '✕ Rejected' : 'Reject'}</button>
                      <button class="btn sm success" data-action="approve" data-player="${escapeHtml(c.player.name)}">${approved ? '✓ Approved' : 'Approve'}</button>
                    </div>
                  ` : '<div></div>'}
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Confirmed tiers</h2>
          <div class="meta">${noChange.length} players held at current</div>
        </div>
        <div class="change-list">
          ${noChange.slice(0, 30).map(c => `
            <div class="change-card no-change">
              <div>
                <div class="change-name">${escapeHtml(c.player.name)}</div>
                <div class="change-meta"><span class="team-dot team-${c.player.team}"></span> ${escapeHtml(c.player.team)}</div>
              </div>
              <span class="tier-pill" data-tier="${c.player.tier}">T${c.player.tier}</span>
              <div></div><div></div><div></div><div></div>
            </div>
          `).join('')}
          ${noChange.length > 30 ? `<div style="padding:12px;text-align:center;color:var(--muted);font-size:13px">+ ${noChange.length - 30} more held at current tier</div>` : ''}
        </div>
      </div>

      <div style="margin-top:32px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between">
        <button class="btn" id="backBtn">← Back</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${isFinalized ? `<button class="btn primary" id="exportBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export report
          </button>` : ''}
          ${isCommish && !isFinalized ? `<button class="btn danger" id="resetAllBtn">Reset all ballots</button>` : ''}
        </div>
      </div>
    `}
  `;

  const authBtn = document.getElementById('commishAuthBtn');
  if (authBtn) authBtn.onclick = () => promptCommish(() => { render(); });

  document.querySelectorAll('.change-actions button').forEach(btn => {
    if (btn.disabled) return;
    btn.onclick = () => {
      const player = btn.dataset.player;
      const action = btn.dataset.action;
      // Safety check: make sure every captain has rated this player.
      const playerEntry = consensus.find(c => c.player.name === player);
      if (!playerEntry || !playerEntry.allRated) {
        toast('All captains must rate this player before it can be approved', 'error');
        return;
      }
      if (!state.finalDecisions) state.finalDecisions = { decisions: {}, finalizedAt: null };
      if (!state.finalDecisions.decisions) state.finalDecisions.decisions = {};
      state.finalDecisions.decisions[player] = { approved: action === 'approve' };
      renderReport();
    };
  });

  const finBtn = document.getElementById('finalizeBtn');
  if (finBtn) finBtn.onclick = () => {
    // Ensure every proposed change has a rating from every captain before finalizing.
    const stillWaiting = changes.filter(c => !c.allRated);
    if (stillWaiting.length > 0) {
      toast(`Cannot finalize — ${stillWaiting.length} player${stillWaiting.length===1?'':'s'} still need ratings from all captains`, 'error');
      return;
    }
    const decisions = state.finalDecisions?.decisions || {};
    changes.forEach(c => {
      if (!(c.player.name in decisions)) decisions[c.player.name] = { approved: true };
    });
    const approvedCount = Object.values(decisions).filter(d => d.approved).length;
    const rejectedCount = Object.values(decisions).filter(d => !d.approved).length;
    const m = modal({
      title: 'Finalize all decisions?',
      body: `<p>This will lock the consensus report and close the ballot.</p>
             <div style="display:flex;gap:8px;margin:14px 0">
               <div style="flex:1;padding:12px;background:var(--success-soft);border-radius:var(--radius);text-align:center">
                 <div style="font-size:24px;font-weight:600;color:var(--success)">${approvedCount}</div>
                 <div style="font-size:11px;color:var(--ink-soft);font-weight:500;letter-spacing:0.04em;text-transform:uppercase">Approved</div>
               </div>
               <div style="flex:1;padding:12px;background:var(--danger-soft);border-radius:var(--radius);text-align:center">
                 <div style="font-size:24px;font-weight:600;color:var(--danger)">${rejectedCount}</div>
                 <div style="font-size:11px;color:var(--ink-soft);font-weight:500;letter-spacing:0.04em;text-transform:uppercase">Rejected</div>
               </div>
             </div>
             <p style="font-size:13px;color:var(--muted)">Anyone with access can still view the final report, but no further changes can be made.</p>`,
      actions: `
        <button class="btn" id="cancelFin">Cancel</button>
        <button class="btn primary" id="confirmFin">Finalize</button>
      `
    });
    document.getElementById('cancelFin').onclick = () => m.close();
    document.getElementById('confirmFin').onclick = async () => {
      state.finalDecisions = { decisions, finalizedAt: new Date().toISOString() };
      await sSet('final-decisions', state.finalDecisions);
      m.close();
      toast('Decisions finalized', 'success');
      render();
    };
  };

  const resetBtn = document.getElementById('resetAllBtn');
  if (resetBtn) resetBtn.onclick = () => {
    const m = modal({
      title: 'Reset all ballots?',
      body: '<p style="padding:12px;background:var(--danger-soft);border-radius:var(--radius);color:var(--danger);font-weight:500">⚠ Destructive action. This wipes every captain\'s ballot and reopens voting from scratch. Use only if instructed.</p>',
      actions: `
        <button class="btn" id="cancelR">Cancel</button>
        <button class="btn primary" id="confirmR" style="background:var(--danger);border-color:var(--danger)">Yes, reset all</button>
      `
    });
    document.getElementById('cancelR').onclick = () => m.close();
    document.getElementById('confirmR').onclick = async () => {
      state.votes = {};
      state.finalDecisions = null;
      await sSet('votes', state.votes);
      await sDel('final-decisions');
      m.close();
      toast('All ballots reset');
      state.view = 'login';
      state.currentCaptain = null;
      render();
    };
  };

  const expBtn = document.getElementById('exportBtn');
  if (expBtn) expBtn.onclick = () => exportReport(consensus);

  document.getElementById('backBtn').onclick = () => {
    if (state.currentCaptain) state.view = 'wait';
    else state.view = 'login';
    render();
  };
}

function exportReport(consensus){
  const decisions = state.finalDecisions?.decisions || {};
  let csv = 'Player,Team,Current Tier,Final Tier,Status,T1 votes,T2 votes,T3 votes,T4 votes,T5 votes\n';
  consensus.forEach(c => {
    const dec = decisions[c.player.name];
    let status = 'NO CHANGE';
    let final = c.player.tier;
    if (c.isChange) {
      if (dec?.approved === true) { status = 'APPROVED'; final = c.winner; }
      else if (dec?.approved === false) { status = 'REJECTED'; final = c.player.tier; }
      else { status = 'PROPOSED'; final = c.winner; }
    }
    csv += `"${c.player.name}","${c.player.team}",${c.player.tier},${final},${status},${c.counts[1]},${c.counts[2]},${c.counts[3]},${c.counts[4]},${c.counts[5]}\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '703_retier_final_report.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('Report downloaded', 'success');
}

function renderDashboard(){
  const app = document.getElementById('app');
  const f = state.dashFilter;
  const teams = [...new Set(ROSTER.map(p => p.team))].sort();

  app.innerHTML = `
    <div class="section" style="margin-top:8px">
      <div class="section-head">
        <div>
          <h2>Player stat dashboard</h2>
          <p style="font-size:13px;color:var(--muted);margin-top:4px">Stat-derived tier suggestions across all 9 criteria · Click any row to see the breakdown</p>
        </div>
        <button class="btn" id="closeDash">← Back</button>
      </div>
    </div>

    <div class="callout how-callout">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <div style="flex:1">
        <details class="how-details">
          <summary><strong>How suggestions work</strong> — click to expand the full methodology</summary>
          <div class="how-body">

            <p><strong>The model combines two independent data sources:</strong> Season 3 averages from the scouting report (PPG, RPG, APG, SPG, BPG, FG%, 3P%, FT%, plus the playing-style note) and game-by-game results parsed from all 40 box scores through Week 5 (who led their team in each category, and whether the team won that game).</p>

            <h4>Step 1 · Score each player on 9 criteria (0–100 each)</h4>
            <p>Every player is scored across the same nine criteria captains use to vote:</p>
            <ul>
              <li><strong>Shooting</strong> — weighted blend of FG% × 0.45 + 3P% × 0.35 + FT% × 0.20, scaled by scoring volume</li>
              <li><strong>Off-Ball Movement</strong> — FG% and 3P% efficiency, with a bonus for low-assist high-efficiency scorers</li>
              <li><strong>Shot Selection</strong> — FG% plus a 3P efficiency bonus, penalized for high volume on low FG%</li>
              <li><strong>Passing/Playmaking</strong> — driven by APG</li>
              <li><strong>Ball Handling</strong> — APG and SPG, with a 20% bump for players tagged as point guards or primary handlers</li>
              <li><strong>Rebounding</strong> — driven by RPG</li>
              <li><strong>On-Ball Defense</strong> — SPG and BPG, with a 20% bump for players tagged "defender" / "lock down" / "disrupt"</li>
              <li><strong>Motor/Hustle</strong> — defensive activity + rebounding, bumped 20% for "hustle" / "grit" / "scrappy" / "active" tags</li>
              <li><strong>Impact</strong> — composite of all per-game contributions (PPG + RPG + APG + SPG + BPG)</li>
            </ul>

            <h4>Step 2 · Apply game-results adjustments (this is where wins come in)</h4>
            <p><strong>Wins are not a standalone category</strong> — but they're heavily used as context. The model checks how each player's individual production correlates with their team actually winning the night. Specifically, the Impact score gets boosted or penalized based on these patterns:</p>
            <ul>
              <li><strong>Led team in scoring during 3+ wins</strong> &nbsp;→&nbsp; <span class="boost">+15 Impact</span> &nbsp;<em>(translates volume into team success)</em></li>
              <li><strong>Led scoring in 1–2 wins</strong> &nbsp;→&nbsp; <span class="boost">+8 Impact</span></li>
              <li><strong>Versatile across 5+ categories</strong> &nbsp;→&nbsp; <span class="boost">+10 Motor, +5 Impact</span></li>
              <li><strong>Versatile across 4 categories</strong> &nbsp;→&nbsp; <span class="boost">+5 Motor</span></li>
              <li><strong>3+ leader appearances, 3+ in wins</strong> &nbsp;→&nbsp; <span class="boost">+5 Impact</span> &nbsp;<em>(rewards role players on winning teams)</em></li>
              <li><strong>4+ leader appearances, zero in wins</strong> &nbsp;→&nbsp; <span class="penalty">−10 Impact, −5 Motor</span> &nbsp;<em>(box-score padding on losing teams)</em></li>
              <li><strong>3+ scoring leads, all in losses</strong> &nbsp;→&nbsp; <span class="penalty">−12 Impact, −10 Shot Selection</span> &nbsp;<em>(volume isn't moving the needle)</em></li>
            </ul>
            <p><strong>Important nuance:</strong> a player on a losing team isn't automatically penalized. They only take a hit if <em>they personally</em> appeared as a box-score leader without their team winning. A quiet bench player on 0-8 Purple still gets scored purely on their own averages — Purple's record doesn't drag them down. Only players who showed up as category leaders get the wins/losses context applied to them.</p>

            <h4>Step 3 · Weighted composite score</h4>
            <p>The 9 criteria are combined into one number using these weights (reflecting what most drives winning basketball):</p>
            <div class="weight-grid">
              <span class="w-row"><strong>Impact</strong> <span class="w-val">× 1.5</span> <span class="w-label">highest</span></span>
              <span class="w-row"><strong>Shooting</strong> <span class="w-val">× 1.3</span></span>
              <span class="w-row"><strong>Defense</strong> <span class="w-val">× 1.2</span></span>
              <span class="w-row"><strong>Shot Selection</strong> <span class="w-val">× 1.0</span></span>
              <span class="w-row"><strong>Passing</strong> <span class="w-val">× 1.0</span></span>
              <span class="w-row"><strong>Rebounding</strong> <span class="w-val">× 1.0</span></span>
              <span class="w-row"><strong>Motor/Hustle</strong> <span class="w-val">× 1.0</span></span>
              <span class="w-row"><strong>Ball Handling</strong> <span class="w-val">× 0.8</span></span>
              <span class="w-row"><strong>Off-Ball Movement</strong> <span class="w-val">× 0.7</span> <span class="w-label">lowest</span></span>
            </div>

            <h4>Step 4 · Assign tiers by percentile</h4>
            <p>The 40 non-captain players are ranked by composite score, then bucketed:</p>
            <ul>
              <li><strong>Top 25%</strong> (≈10 players) → T2</li>
              <li><strong>Next 25%</strong> (≈10 players) → T3</li>
              <li><strong>Next 35%</strong> (≈14 players) → T4</li>
              <li><strong>Bottom 15%</strong> (≈6 players) → T5</li>
            </ul>
            <p>This is <em>relative</em> ranking, not absolute — even if the entire league improved, the same proportions land in each tier. Tiers exist for draft parity, not as skill grades. <strong>Captains are locked at T1</strong> and don't go through this process.</p>

            <h4>Step 5 · Guardrails to prevent unreasonable moves</h4>
            <ol>
              <li><strong>No two-tier jumps without strong evidence.</strong> A T4 player can only be moved to T2 if they have 2+ PTS leads in actual wins. Same for demotions in reverse — a T2→T4 move requires 3+ PTS leads with zero wins. Otherwise the move is capped at ±1 tier.</li>
              <li><strong>Traded players hold their current tier.</strong> Anyone marked "(Traded)" in their scouting notes doesn't get moved, since their stats may reflect a different team context.</li>
              <li><strong>Single-appearance players can't be demoted.</strong> With only 1 leader appearance, there isn't enough data to call them worse than their captain assigned. They can still be promoted on strong season averages.</li>
              <li><strong>No big moves without game data.</strong> If a player has zero leader appearances and the model wants to move them 2+ tiers, the move is capped at ±1.</li>
            </ol>

            <h4>What the model can't see</h4>
            <ul>
              <li><strong>Defensive impact beyond steals/blocks</strong> — help defense, communication, positioning, contests don't show up in box scores</li>
              <li><strong>Chemistry and intangibles</strong> — the model doesn't know who makes their teammates better</li>
              <li><strong>Strength of opponent</strong> — leading scoring against 0-8 Purple counts the same as leading scoring against 6-2 White</li>
              <li><strong>Garbage time vs. clutch moments</strong> — a 20-point game in a blowout looks the same as a 20-point game in a tight finish</li>
              <li><strong>Mid-season trades</strong> — the model can flag traded players but doesn't know who's actively playing where</li>
            </ul>

            <p style="margin-top:14px"><strong>Bottom line:</strong> the model is a starting point, not an oracle. Every suggestion comes with its underlying reasoning visible in the "Why this suggestion" block — and the criteria bars show exactly what drove the call. Captains should override it freely when their eye test and game tape disagree.</p>

          </div>
        </details>
      </div>
    </div>

    <div class="dash-filters">
      <div class="filter-group">
        <label>Current tier</label>
        <div class="chip-row">
          ${['all',1,2,3,4,5].map(v => `<button class="chip ${f.tier==v?'on':''}" data-cf="tier" data-v="${v}">${v==='all'?'All':'T'+v}</button>`).join('')}
        </div>
      </div>
      <div class="filter-group">
        <label>Suggested tier</label>
        <div class="chip-row">
          ${['all',1,2,3,4,5].map(v => `<button class="chip ${f.sugTier==v?'on':''}" data-cf="sugTier" data-v="${v}">${v==='all'?'All':'T'+v}</button>`).join('')}
        </div>
      </div>
      <div class="filter-group">
        <label>Movement</label>
        <div class="chip-row">
          <button class="chip ${f.move=='all'?'on':''}" data-cf="move" data-v="all">All</button>
          <button class="chip ${f.move=='up'?'on':''}" data-cf="move" data-v="up">▲ Promote</button>
          <button class="chip ${f.move=='down'?'on':''}" data-cf="move" data-v="down">▼ Demote</button>
          <button class="chip ${f.move=='hold'?'on':''}" data-cf="move" data-v="hold">Hold</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Team</label>
        <select id="dashTeam">
          <option value="all">All teams</option>
          ${teams.map(t => `<option value="${escapeHtml(t)}" ${f.team===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group" style="flex:1;min-width:180px">
        <label>Search</label>
        <input type="search" id="dashSearch" placeholder="Name or team…" value="${escapeHtml(state.dashSearch)}" />
      </div>
      <div class="filter-group">
        <label>Sort</label>
        <select id="dashSort">
          <option value="score-desc" ${state.dashSort==='score-desc'?'selected':''}>Composite ↓</option>
          <option value="score-asc" ${state.dashSort==='score-asc'?'selected':''}>Composite ↑</option>
          <option value="tier-asc" ${state.dashSort==='tier-asc'?'selected':''}>Current tier ↑</option>
          <option value="tier-desc" ${state.dashSort==='tier-desc'?'selected':''}>Current tier ↓</option>
          <option value="name" ${state.dashSort==='name'?'selected':''}>Name A–Z</option>
        </select>
      </div>
    </div>

    <div class="dash-grid" id="dashGrid"></div>
  `;

  renderDashGrid();

  document.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => {
      const key = c.dataset.cf;
      let v = c.dataset.v;
      if (v !== 'all' && v !== 'up' && v !== 'down' && v !== 'hold') v = parseInt(v);
      state.dashFilter[key] = v;
      renderDashboard();
    };
  });
  document.getElementById('dashTeam').onchange = (e) => { state.dashFilter.team = e.target.value; renderDashboard(); };
  document.getElementById('dashSort').onchange = (e) => { state.dashSort = e.target.value; renderDashGrid(); };
  document.getElementById('dashSearch').oninput = (e) => { state.dashSearch = e.target.value; renderDashGrid(); };
  document.getElementById('closeDash').onclick = () => {
    const back = state.returnFrom || (state.currentCaptain ? (state.votes[state.currentCaptain]?.submitted ? 'wait' : 'vote') : 'login');
    state.returnFrom = null;
    state.view = back;
    render();
  };
}

function renderDashGrid(){
  const grid = document.getElementById('dashGrid');
  if (!grid) return;
  const f = state.dashFilter;
  let rows = ROSTER.map(p => {
    const sug = SUGGESTIONS[p.name];
    return { p, sug, suggested: sug.suggested };
  });
  if (f.tier !== 'all') rows = rows.filter(r => r.p.tier === f.tier);
  if (f.sugTier !== 'all') rows = rows.filter(r => r.suggested === f.sugTier);
  if (f.team !== 'all') rows = rows.filter(r => r.p.team === f.team);
  if (f.move === 'up')   rows = rows.filter(r => r.suggested < r.p.tier);
  if (f.move === 'down') rows = rows.filter(r => r.suggested > r.p.tier);
  if (f.move === 'hold') rows = rows.filter(r => r.suggested === r.p.tier);
  const q = state.dashSearch.trim().toLowerCase();
  if (q) rows = rows.filter(r => r.p.name.toLowerCase().includes(q) || r.p.team.toLowerCase().includes(q));

  const sortFns = {
    'score-desc': (a,b) => b.sug.score - a.sug.score,
    'score-asc':  (a,b) => a.sug.score - b.sug.score,
    'tier-asc':   (a,b) => a.p.tier - b.p.tier || b.sug.score - a.sug.score,
    'tier-desc':  (a,b) => b.p.tier - a.p.tier || b.sug.score - a.sug.score,
    'name':       (a,b) => a.p.name.localeCompare(b.p.name),
  };
  rows.sort(sortFns[state.dashSort] || sortFns['score-desc']);

  if (rows.length === 0){
    grid.innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted)">No players match these filters.</div>`;
    return;
  }

  grid.innerHTML = rows.map(({p, sug, suggested}) => {
    const move = sug.locked ? 'lock' : (suggested < p.tier ? 'up' : suggested > p.tier ? 'down' : 'hold');
    const arrowChar = move==='up' ? '▲' : move==='down' ? '▼' : move==='lock' ? '🔒' : '=';
    const moveLbl = move==='up' ? '▲ Promote' : move==='down' ? '▼ Demote' : move==='lock' ? '🔒 Locked' : 'Hold';
    const expanded = state.dashExpanded === p.name;
    return `
      <div class="dash-card ${move}" data-player="${escapeHtml(p.name)}">
        <div class="dash-head">
          <div class="dash-id">
            <div class="dash-rank">#${sug.rank || '—'}</div>
            <div style="min-width:0;flex:1">
              <div class="dash-name">${escapeHtml(p.name)}${p.isCaptain ? '<span class="badge capt">Captain</span>' : ''}</div>
              <div class="dash-sub"><span class="team-dot team-${p.team}"></span> ${escapeHtml(p.team)}</div>
              ${p.style && p.style !== 'Captain' ? `<div class="dash-style">${escapeHtml(p.style)}</div>` : ''}
            </div>
          </div>
          <div class="dash-tiers">
            <div class="tier-block"><span class="tier-pill" data-tier="${p.tier}">T${p.tier}</span><span class="tier-lbl">Current</span></div>
            <div class="dash-arrow ${move}">${arrowChar}</div>
            <div class="tier-block"><span class="tier-pill" data-tier="${suggested}">T${suggested}</span><span class="tier-lbl">Suggested</span></div>
          </div>
          <div class="dash-statline">
            <div class="stat"><span class="v">${p.ppg ?? '—'}</span><span class="k">PPG</span></div>
            <div class="stat"><span class="v">${p.rpg ?? '—'}</span><span class="k">RPG</span></div>
            <div class="stat"><span class="v">${p.apg ?? '—'}</span><span class="k">APG</span></div>
            <div class="stat"><span class="v">${p.fgp ?? '—'}${p.fgp ? '%' : ''}</span><span class="k">FG</span></div>
            <div class="stat"><span class="v">${p.tpp ?? '—'}${p.tpp ? '%' : ''}</span><span class="k">3P</span></div>
          </div>
          <div class="dash-meta">
            <div class="move-tag ${move}">${moveLbl}</div>
            <div class="composite-score">Score <strong>${sug.score}</strong></div>
            <button class="expand-btn">${expanded ? 'Hide ▲' : 'Breakdown ▼'}</button>
          </div>
        </div>
        ${expanded ? `
          <div class="dash-breakdown">
            <div class="reason-block">
              <div class="reason-label">Why this suggestion</div>
              <div class="reason-text">${escapeHtml(sug.reason || '')}</div>
            </div>
            <div class="crit-list">
            ${CATEGORY_LIST.map(cat => {
              const v = sug.criteria[cat];
              const pct = Math.max(0, Math.min(100, v));
              return `
                <div class="crit-row">
                  <div class="crit-name">${cat}</div>
                  <div class="crit-bar"><div class="crit-fill" style="width:${pct}%"></div></div>
                  <div class="crit-val">${v.toFixed(1)}</div>
                </div>
              `;
            }).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.dash-card').forEach(card => {
    card.querySelector('.expand-btn').onclick = (e) => {
      e.stopPropagation();
      const name = card.dataset.player;
      state.dashExpanded = state.dashExpanded === name ? null : name;
      renderDashGrid();
    };
  });
}

function render(){
  renderNavActions();
  if (state.view === 'login') renderLogin();
  else if (state.view === 'vote') renderVote();
  else if (state.view === 'wait') renderWait();
  else if (state.view === 'dashboard') renderDashboard();
  else if (state.view === 'report' || state.view === 'final') renderReport();
}

(async function init(){
  await loadAll();
  startRealtimeSync();
  render();
})();
</script>
